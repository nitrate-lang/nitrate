[package]
name = "nitrate_tree2"
version = "0.1.0"
edition = "2024"

[dependencies]
nitrate_nstring = { path = "../nstring" }
nitrate_diagnosis = { path = "../../../diagnosis" }

nitrate_token = { path = "../token" }
nitrate_token_lexer = { path = "../token_lexer" }

ordered-float = "5.0.0"
serde = { version = "1.0.219", features = ["derive", "rc"] }
append-only-vec = "0.1"
thin-vec = { version = "0.2", features = ["serde"] }
bitflags = "2.10"
