[package]
name = "nitrate_driver"
version = "0.1.0"
edition = "2024"

[dependencies]
nitrate_translation = { path = "../translation" }
nitrate_diagnosis = { path = "../diagnosis" }

clap = { version = "4.5.47", features = ["derive"] }
anstyle = "1.0.11"
anstream = "0.6.20"
slog = "2.7.0"
slog-async = "2.8.0"
slog-term = "2.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
anyhow = "1.0"
thiserror = "2"
tokio = { version = "1.36.0", features = ["full"] }

flate2.workspace = true
semver.workspace = true
tar.workspace = true
toml.workspace = true
toml_edit.workspace = true
ureq.workspace = true
